<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Script-Controlled ACL Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>Script-Controlled ACL Controller</h1>
      <p>Evaluate access privileges based on dynamic script rules.</p>
    </header>

    <div class="card">
      <div class="form-group">
        <select id="role-select">
          <option value="admin">Role: Admin</option>
          <option value="developer">Role: Developer</option>
          <option value="guest">Role: Guest</option>
        </select>

        <select id="action-select">
          <option value="read">Action: Read</option>
          <option value="write">Action: Write</option>
          <option value="execute">Action: Execute</option>
          <option value="delete">Action: Delete</option>
        </select>

        <button id="eval-btn">Evaluate Rule</button>
      </div>
    </div>

    <div class="card">
      <h3>Access Evaluation Log</h3>
      <table>
        <thead>
          <tr>
            <th>Role</th>
            <th>Action</th>
            <th>Status</th>
            <th>Reason</th>
          </tr>
        </thead>
        <tbody id="log-body">
          <!-- Evaluated results will be added here -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
